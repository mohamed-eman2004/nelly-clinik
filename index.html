/* NILI CLINIC | Refined desktop workspace, collapsible navigation and entry cards */
:root{--r:18px;--shadow:0 7px 30px rgba(20,42,66,.055)}
body{background:#f5f8fc;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
.sidebar{transition:width .25s ease,padding .25s ease,opacity .2s ease;overflow:hidden;z-index:40;box-shadow:inset -1px 0 rgba(255,255,255,.04)}
.sidebar .nav-item,.sidebar .brand,.sidebar .sidebar-bottom,.sidebar .nav-title{min-width:210px}
.app.nav-collapsed>.sidebar{width:0;padding-right:0;padding-left:0;opacity:0;pointer-events:none}
.main{transition:min-width .2s ease}.top{position:sticky;top:0;z-index:35;box-shadow:0 2px 16px rgba(20,45,85,.025)}
.nav-toggle{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;background:#f1f7fa;border:1px solid #dce9f0;border-radius:12px;color:#276b86;transition:.18s;margin-left:16px}
.nav-toggle:hover{background:#e1f4f5;border-color:#90d1d8;box-shadow:0 3px 12px #188b9816}
.nav-burger{width:19px;display:grid;gap:4px}.nav-burger i{display:block;height:2px;width:100%;background:currentColor;border-radius:4px}
.nav-burger i:nth-child(2){width:72%}
.nav-scrim{display:none}
.container{max-width:1710px}.panel,.kpi{border-color:#e6ecf4}.panel-title{color:#162947}
.btn{box-shadow:0 3px 8px #076b8512}.field label{color:#354967}.field input:focus-visible,.field select:focus-visible,button:focus-visible{outline:2px solid #38a2af;outline-offset:2px}
.search-with-add{display:flex;align-items:flex-end;gap:8px;min-width:0}
.search-with-add>.field{flex:1;min-width:0}
.quick-add-btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;justify-content:center;height:43px;border-radius:11px;padding:0 12px;border:1px solid #bde5e5;background:#effbfa;color:#087b83;font-weight:800;white-space:nowrap;transition:.16s}
.quick-add-btn:hover{background:#d4f3f0;border-color:#78cfd0;transform:translateY(-1px)}
.quick-add-btn span{font-size:11px}
.quick-modal-shade{position:fixed;inset:0;z-index:999;background:rgba(10,24,48,.57);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;animation:fadeIn .16s ease}
.quick-modal{background:#fff;border:1px solid #e7eef7;border-radius:23px;box-shadow:0 30px 90px #071b3c70;width:100%;max-width:475px;padding:26px 27px 24px;display:grid;gap:17px;animation:modalUp .2s ease}
.quick-modal-head{display:flex;gap:12px;align-items:center}.quick-modal-head h2{margin:1px 0 0;font-size:20px;color:#152949}
.quick-modal-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:#e5f7f5;color:#10888d;font-size:27px}
.modal-x{margin-right:auto;align-self:flex-start;border:0;border-radius:10px;width:34px;height:34px;background:#f3f6fa;color:#657991}
.quick-modal .hint{margin:-4px 0 0;font-size:12px}.quick-modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:7px}
.journal-filter-panel{margin-bottom:18px}.journal-filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.journal-filters .search-all{grid-column:span 2}
.journal-stack{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:18px}
.journal-count{color:#536a85;font-weight:750;margin:16px 3px 10px}.journal-count span{font-size:11px;color:#879ab0;font-weight:500}
.journal-card{background:white;border:1px solid #e2eaf2;border-radius:19px;box-shadow:0 7px 24px #172d5211;overflow:hidden;transition:box-shadow .2s,transform .2s}
.journal-card:hover{box-shadow:0 11px 32px #172d521a;transform:translateY(-1px)}
.journal-card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(105deg,#fcfdff,#f4f9fc);padding:17px 22px;border-bottom:1px solid #e7eef5}
.journal-ident{display:flex;align-items:center;gap:12px}.journal-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#dff3f4;color:#0b778a;font-size:22px}
.journal-ident h3{margin:0;font-size:16px;line-height:1.35;text-align:right;font-weight:800;color:#233b60}.journal-subtitle{font-size:10px;color:#8997a8}
.journal-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11.5px;color:#637b94}
.journal-meta>span:not(.pill){background:#fff;border:1px solid #e6edf4;border-radius:20px;padding:5px 10px}
.journal-description{padding:14px 22px;font-size:12px;color:#52677e;background:white}
.journal-lines{border:0;border-radius:0;margin:0 14px 15px}.journal-lines .table th{background:#f6f8fc}.journal-lines .table td{white-space:normal}.journal-lines .table .amount{text-align:right;direction:ltr;white-space:nowrap}
.journal-lines .journal-debit td:first-child{border-right:3px solid #21aa99}.journal-lines .journal-credit td:first-child{border-right:3px solid #6c8eb6}
.entry-side{display:inline-block;padding:2px 7px;margin-left:7px;font-size:10px;border-radius:7px;vertical-align:middle}.debit-side{background:#e0f7ef;color:#15856f}.credit-side{background:#eaf0ff;color:#4f70a9}
.journal-lines tfoot td{padding:12px;background:#f5f9fc;color:#1c3855;border-top:1px solid #dde7f1;font-weight:800}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes modalUp{from{transform:translateY(10px);opacity:.5}to{transform:translateY(0);opacity:1}}
@media(max-width:1200px){.journal-filters{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:960px){.app.nav-collapsed>.sidebar{width:265px;padding:25px 14px;opacity:1;pointer-events:auto}.sidebar{width:265px;overflow-y:auto}.nav-scrim.visible{display:block;position:fixed;inset:0;z-index:145;background:#091e36a3;backdrop-filter:blur(2px)}.sidebar.open{z-index:150}.btn-close-menu{display:block}.journal-filters{grid-template-columns:repeat(2,minmax(0,1fr))}.top{position:sticky;top:0}}
@media(max-width:640px){.journal-filters{grid-template-columns:1fr}.journal-filters .search-all{grid-column:auto}.journal-card-head{padding:14px}.journal-description{padding:12px 14px}.journal-meta{gap:5px}.journal-lines{margin:0 5px 10px}.journal-lines .table{font-size:11px}.journal-lines .table td,.journal-lines .table th{padding:10px 7px}.quick-add-btn{padding:0 9px}.quick-add-btn span{display:none}.quick-modal{padding:20px}.nav-toggle{margin-left:10px}}
@media print{.nav-toggle,.nav-scrim,.journal-filter-panel{display:none!important}.app.nav-collapsed>.sidebar{display:none!important}.journal-card{box-shadow:none;break-inside:avoid}}

@media print {.sidebar,.top-tools,.btn,.tabs,.switcher,.toolbar,.quick{display:none!important}.sidebar{display:none}.top{padding:8px}.container{padding:0}.panel,.kpi{box-shadow:none;break-inside:avoid}.main{width:100%}}

.text-link{border:0;padding:4px 1px;background:transparent;color:#1769a4;font-weight:800;font-family:inherit;cursor:pointer;text-align:right;transition:color .2s}
.text-link:hover{color:#103d65;text-decoration:underline;text-underline-offset:4px}
.btn.compact{padding:8px 12px;font-size:12px;white-space:nowrap}
.detail-controls{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0}
.detail-exports{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.statement-paper{border:1px solid #dfebf1;border-radius:16px;padding:24px;background:#fff;box-shadow:0 8px 26px rgba(25,62,96,.045);margin-top:16px}
.statement-head,.detail-heading{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:21px}
.statement-brand{font:800 16px system-ui,sans-serif;color:#26648c;letter-spacing:1px;margin-bottom:5px}
.statement-head h3,.detail-heading h3{margin:4px 0 8px;font-size:23px;color:#123b60}
.statement-current{background:#eaf5fb;border:1px solid #d4e9f3;border-radius:14px;padding:14px 22px;color:#3b6680;font-size:12px;display:flex;gap:6px;flex-direction:column}
.statement-current strong{font-size:23px;color:#143e63}
.statement-facts{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:12px;margin:0 0 24px}
.statement-facts>div{background:#f6f9fc;border:1px solid #e5edf4;border-radius:12px;padding:13px;display:grid;gap:7px}
.statement-facts span{font-size:12px;color:#74889d}
.statement-facts b{color:#234663;font-size:14px}
.statement-total{border-top:2px solid #dae7ef;padding:15px 0 0;margin-top:12px;display:flex;gap:22px;flex-wrap:wrap;justify-content:space-between;font-size:13px}
.statement-total strong{color:#16476b;font-size:16px}
.statement-select{display:flex;align-items:flex-end;flex-wrap:wrap;gap:15px;margin-top:20px}
.statement-select select{min-width:320px;max-width:100%}
.muted{color:#9aa6b1;font-size:12px}.neg{color:#bd4351}
@media(max-width:740px){.statement-paper{padding:12px}.statement-facts{grid-template-columns:repeat(2,minmax(0,1fr))}.statement-current strong{font-size:18px}.detail-controls{align-items:stretch}.detail-exports{width:100%}.detail-exports button{flex:1}}


/* Accurate alignment of inline search and quick-add action */

.search-input-wrap{position:relative;flex:1;min-width:0}
.search-input-wrap>input{height:44px;width:100%;min-width:0}
.search-input-wrap>.picker-options{top:calc(100% + 5px);right:0;left:0;z-index:70}
.search-with-add>.quick-add-btn{height:44px;min-width:91px;align-self:center;margin:0;flex-shrink:0}
.payment-pair{display:grid;gap:10px;min-width:0}
.payment-pair>.field{min-width:0}
.journal-document{display:inline-flex;align-items:center;gap:5px}

/* ================================================================
   NILI CLINIC | Responsive v6
   Layout only: desktop, laptop, tablet and phone.

   ================================================================ */
:root{--mobile-gutter:16px}
html{max-width:100%;scroll-padding-top:90px;-webkit-text-size-adjust:100%}
body{min-width:0;max-width:100%;overflow-x:clip}
.app,.main,.container,.form-layout,.form-stack,.summary-side,
.grid,.grid>* ,.panel,.panel>*,.kpi,.quick,.quick>div,
.toolbar,.toolbar>*,.statement-paper,.detail-controls,.journal-stack,
.journal-card,.search-with-add,.search-input-wrap{min-width:0}
.main{width:100%;max-width:100%}
.container{width:100%}
.panel,.kpi,.soft,.statement-paper,.journal-card{max-width:100%}
.grid>*{max-width:100%}
/* Large records scroll INSIDE their panel, not the entire web page. */
.table-wrap,.journal-lines{display:block;min-width:0;max-width:100%;overflow-x:auto;overflow-y:auto;
    overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;
    scrollbar-color:#b9cfdb #eef4f8}
.table-wrap::-webkit-scrollbar,.journal-lines::-webkit-scrollbar{height:8px}
.table-wrap::-webkit-scrollbar-thumb,.journal-lines::-webkit-scrollbar-thumb{background:#b9cfdb;border-radius:20px}
.table-wrap::-webkit-scrollbar-track,.journal-lines::-webkit-scrollbar-track{background:#eef4f8}
.table-wrap>.table,.journal-lines .table{width:max-content;min-width:100%;max-width:none}
.table th,.table td{vertical-align:middle}
.panel-title,.section-head,.detail-heading,.statement-head{min-width:0}
.panel-title>*,.section-head>*,.detail-heading>*,.statement-head>*{min-width:0}
.kpi-number{overflow-wrap:anywhere;letter-spacing:-.4px;line-height:1.5}
.chart,.bar-row{min-width:0}
.bar-row{grid-template-columns:minmax(0,1fr) minmax(38px,2fr) minmax(70px,auto)}
.bar-row>span:first-child{min-width:0;overflow-wrap:anywhere;line-height:1.6}
.bar-val{white-space:nowrap;direction:ltr;font-size:12px}
.grid.two,.grid.three,.grid.four,.grid.metrics{min-width:0}
.field,.field input,.field textarea,.field select,.toolbar .field,.statement-select select{
    min-width:0;max-width:100%}
input,select,textarea{touch-action:manipulation}
.field input[type="date"],.field input[type="datetime-local"]{min-width:0}
.top .split{min-width:0;flex:1}
.top .split>div{min-width:0}
.top h1{overflow-wrap:anywhere}
.nav-toggle{touch-action:manipulation}
.quick-add-btn{min-height:44px}
.search-input-wrap>.picker-options,.picker-options{max-width:100%;overscroll-behavior:contain}
.quick-modal-shade{overflow-y:auto;overscroll-behavior:contain}
.quick-modal{max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior:contain}
.quick-modal-actions{flex-wrap:wrap}
.detail-controls,.toolbar,.action-strip,.statement-select,.export-group{min-width:0}
.statement-facts{min-width:0;grid-template-columns:repeat(4,minmax(0,1fr))}
.statement-facts>div{min-width:0}
.statement-facts b{overflow-wrap:anywhere}
.toastbox{max-width:min(400px,calc(100vw - 30px))}
/* Laptop and small desktop screens */
@media(max-width:1440px){
 .container{padding-inline:25px}
 .top{padding-inline:25px}
 .grid.metrics{gap:14px}
 .kpi{padding:17px}
}
@media(max-width:1200px){
 .grid.four,.grid.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
 .grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}
 .statement-facts{grid-template-columns:repeat(2,minmax(0,1fr))}
 .form-layout{grid-template-columns:minmax(0,1fr)}
 .summary-side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
 .summary-side .panel+.panel{margin-top:0}
}
/* Touch-navigation drawer: mobile and tablets including tablet landscape */
@media(max-width:1100px){
 .app{display:block;min-height:100dvh}
 .app>.sidebar,.app.nav-collapsed>.sidebar{
   position:fixed;top:0;right:0;left:auto;bottom:0;
   width:min(305px,88vw);height:100dvh;min-height:0;
   padding:22px 15px 18px;display:flex;flex-direction:column;
   opacity:1;pointer-events:auto;overflow-x:hidden;overflow-y:auto;
   transform:translate3d(105%,0,0);
   transition:transform .22s ease;z-index:151;
   box-shadow:-6px 0 42px #10284929;
 }
 .app>.sidebar.open,.app.nav-collapsed>.sidebar.open{transform:translate3d(0,0,0)}
 .sidebar .nav-item,.sidebar .brand,.sidebar .sidebar-bottom,.sidebar .nav-title{min-width:0}
 .nav-scrim.visible{display:block;position:fixed;inset:0;z-index:149;background:#091e36a8;backdrop-filter:blur(2px)}
 .btn-close-menu{display:block;min-width:40px;min-height:40px;font-size:17px}
 .main{display:block;width:100%;min-width:0}
 .top{padding:13px 20px;min-height:74px}
 .container{padding:20px 20px 38px}
 body.nili-menu-open{overflow:hidden}
 .journal-filters{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* Portrait tablet and small laptop */
@media(max-width:820px){
 .grid.two{grid-template-columns:minmax(0,1fr)}
 .container{padding:18px 18px 32px}
 .top{padding:10px 18px}
 .grid.two>.panel+.panel{margin-top:0}
 .quick{padding:18px 20px}
 .form-layout{gap:15px}
 .journal-meta{gap:7px}
 .statement-select{align-items:stretch}
 .statement-select .field{flex:1 1 220px}
 .statement-head,.detail-heading{gap:12px}
 .detail-controls{align-items:stretch}
 .toolbar .field{flex:1 1 180px}
 .toolbar .grow{flex:1 1 220px}
}
/* Phones, both orientations */
@media(max-width:640px){
 :root{--mobile-gutter:14px}
 .container{padding:16px var(--mobile-gutter) 30px}
 .top{padding:9px var(--mobile-gutter);min-height:68px;gap:7px}
 .top .split{gap:10px}
 .top h1{font-size:19px;line-height:1.3}
 .top .eyebrow{font-size:10px}
 .top-tools{display:none}
 .nav-toggle{height:44px;width:44px;flex:0 0 44px;margin-left:0}

 .section-head h2{font-size:18px}
 .section-head>.btn{width:100%;min-height:44px}
 .form-layout,.form-stack{gap:14px}
 .field label{font-size:12px}
 .field input,.field select,.field textarea,.search-input-wrap>input{

 .field textarea{min-height:90px}
 .tabs{gap:5px;padding:5px;margin-bottom:16px}
 .tabs .tab{min-width:calc(50% - 5px);flex:1 1 calc(50% - 5px);min-height:43px;padding:9px 6px}

 .switcher button{flex:1 1 auto;min-height:41px;padding:8px 11px}

 .toolbar .field,.toolbar .grow{min-width:0;flex:1 1 100%}
 .toolbar .btn,.export-group .btn{min-height:42px}
 .export-group{width:100%}
 .export-group .btn{flex:1 1 auto}
 .search-with-add{gap:8px;align-items:center}

 .search-with-add>.quick-add-btn span{display:none}
 .picker-options{max-height:min(260px,40dvh)}
 .item-mini{flex-wrap:wrap;gap:10px}
 .item-mini .field,.item-mini .field.short{flex:1 1 calc(50% - 5px);min-width:0;max-width:none}
 .item-mini>.btn,.item-mini>button{min-height:44px}
 .action-strip{align-items:stretch;gap:12px}
 .action-strip>.hint{flex:1 1 100%}
 .action-strip>.btn{width:100%;min-height:48px;white-space:normal}
 .summary-total{font-size:26px}
 .preview-row{gap:8px;flex-wrap:wrap}
 .bar-row{grid-template-columns:minmax(0,1fr) minmax(34px,1.1fr) minmax(68px,auto);gap:8px;margin:11px 0}
 .bar-row>span:first-child{font-size:11px}
 .bar-val{font-size:10.5px}
 .table{font-size:12px}
 .table th,.table td{padding:9px 10px}
 .table button{min-height:36px}
 .journal-filters,.journal-filters .search-all{grid-template-columns:minmax(0,1fr);grid-column:auto}
 .journal-card-head{padding:13px;align-items:flex-start}
 .journal-ident{gap:9px;min-width:0}

 .journal-meta{gap:5px}

 .journal-lines{margin:0 6px 10px}
 .journal-lines .table{font-size:11px}
 .journal-description{padding:10px 13px}
 .statement-paper{padding:13px;border-radius:13px}
 .statement-head h3,.detail-heading h3{font-size:19px}
 .statement-facts{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

 .statement-current{padding:11px 13px}

 .detail-exports .btn{flex:1;min-height:44px}
 .quick-modal-shade{padding:10px;align-items:center}
 .quick-modal{max-width:100%;max-height:calc(100dvh - 20px);padding:18px;border-radius:16px;gap:14px}

 .quick-modal-actions button{flex:1 1 auto;min-height:44px}
 .toastbox{left:10px;right:10px;bottom:10px;max-width:none}
 .toast{padding:11px 13px}
}

 .quick{padding:14px}
 .bar-row{grid-template-columns:minmax(0,1fr) minmax(25px,1fr) minmax(58px,auto);gap:6px}

 .search-with-add{gap:6px}
 .search-with-add>.quick-add-btn{min-width:42px;padding:0 6px}
 .journal-meta{font-size:10px}

}

}
@media print{
 body{overflow:visible!important}
 .container,.main,.panel,.table-wrap{overflow:visible!important;max-width:none}
 .app{display:block}
 .nav-scrim{display:none!important}
}

function supplierAccountId(name,data=state){let a=data.settings.accounts.find(x=>x.supplierKey&&norm(x.supplierKey)===norm(name));if(!a)throw Error('لا يوجد حساب مستقل للمورد «'+name+'». أضف المورد من الإعدادات أولًا.');return String(a.id)}

function fifoEstimate(itemId,branch,date,qty){let needed=Number(qty),remaining=needed,allocations=[],cost=0;if(!branch)throw Error('اختر الفرع أولًا');if(!date)throw Error('اختر تاريخ العملية');if(!(needed>0))throw Error('الكمية يجب أن تكون أكبر من صفر');let later=state.usages.find(u=>u.itemId===itemId&&u.branch===branch&&u.date>date);if(later)throw Error('لا يمكن تسجيل صرف مخزون بتاريخ أقدم من صرف سابق لنفس الصنف؛ راجع التاريخ');const lots=state.lots.filter(x=>x.itemId===itemId&&x.branch===branch&&x.date<=date).sort((a,b)=>a.date.localeCompare(b.date)||a.seq-b.seq);for(let lot of lots){let spent=state.usages.reduce((s,u)=>s+u.allocations.filter(p=>p.lotId===lot.id).reduce((a,p)=>a+p.qty,0),0);let avail=r2(lot.qty-spent);if(avail<=0)continue;let used=Math.min(remaining,avail);let part=r2(used*lot.unitCost);allocations.push({lotId:lot.id,qty:used,cost:part,unitCost:lot.unitCost});cost=r2(cost+part);remaining=r2(remaining-used);if(remaining<.000001)break;}if(remaining>.000001){let item=state.settings.items.find(x=>x.id===itemId);throw Error('رصيد '+(item?.name||'الصنف')+' غير كافٍ في فرع '+branch+'؛ المتاح '+m(stockQty(itemId,branch,date))+' والمطلوب '+m(needed))}return {allocations,cost}}

function suppliersHTML(){let open=state.invoices.filter(x=>invoiceBalance(x)>0).length;let overdue=state.invoices.filter(x=>x.due&&x.due<today()&&invoiceBalance(x)>0).length;let ledgers=state.settings.suppliers.map(name=>({name,id:supplierAccountId(name),balance:supplierAccountBalance(name),invoices:state.invoices.filter(i=>norm(i.supplier)===norm(name)),due:r2(state.invoices.filter(i=>norm(i.supplier)===norm(name)).reduce((s,i)=>s+Math.max(0,invoiceBalance(i)),0))}));return `<div class="section-head"><div><h2>حسابات الموردين</h2><p>لكل مورد حساب مستقل في شجرة الحسابات، مع متابعة الفواتير والمدفوعات.</p></div><button class="btn" data-nav="entry">＋ فاتورة أو سداد</button></div><div class="grid three" style="margin-bottom:18px">${kpi('إجمالي المديونية',m(outstanding())+' ج.م','متبقي الفواتير','#fff5e8')}${kpi('فواتير مفتوحة',open,'قابلة للسداد','#e9f2ff')}${kpi('فواتير متأخرة',overdue,'تحتاج متابعة','#fff0f0')}</div><div class="panel" style="margin-bottom:18px"><div class="panel-title">كشف حساب مستقل لكل مورد ${pill(ledgers.length+' مورد','blue')}</div><p class="hint">الرصيد الإجمالي = مستحقات المورد المستوردة من Excel عند البداية + صافي قيود اليومية الجديدة. أرصدة البداية تُحتسب للعرض دون إنشاء قيود تاريخية افتراضية.</p>${table(['رقم الحساب','اسم المورد','الرصيد الإجمالي للمورد','متبقي الفواتير','الفواتير','المستند'],ledgers.map(x=>[`<span class="code">${h(x.id)}</span>`,detailLink('supplier',x.name),`<b class="amount">${m(x.balance)} ج.م</b>`,`<b class="amount">${m(x.due)} ج.م</b>`,x.invoices.length,docsButton(newestDocForSupplier(x.name))]))}</div><div class="panel"><div class="panel-title">فواتير الموردين <button class="btn secondary" data-export="invoices">تنزيل Excel ↧</button></div>${table(['المورد','رقم الحساب','رقم الفاتورة','التاريخ','إجمالي الفاتورة','المدفوع','المتبقي','الاستحقاق','الحالة','المستندات',''],[...state.invoices].sort((a,b)=>(a.due||'').localeCompare(b.due||'')).map(x=>[detailLink('supplier',x.supplier),`<span class="code">${h((state.settings.accounts.find(a=>a.supplierKey&&norm(a.supplierKey)===norm(x.supplier))||{}).id||'—')}</span>`,h(x.invoice),isoDate(x.date),`<b class="amount">${m(x.amount)}</b>`,m(x.paid),`<b class="amount">${m(invoiceBalance(x))}</b>`,isoDate(x.due),dueStatus(x),x.documents?.length?`<button class="btn secondary" data-files="${h(x.id)}">▧ عرض</button>`:'—',invoiceBalance(x)>0?`<button class="btn secondary" data-pay="${h(x.id)}">سداد</button>`:'—']))}</div>`}
function groupedJournal(){let groups=new Map();for(const line of state.journal){let id=String(line.txnId||'غير مرقم');if(!groups.has(id))groups.set(id,{id,date:line.date||'',branch:line.branch||'',description:line.details||'',lines:[]});groups.get(id).lines.push(line)}return [...groups.values()].sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.id).localeCompare(String(a.id)))}
function filteredJournalGroups(){return groupedJournal().filter(g=>{let f=journalFilters;if(f.from&&g.date<f.from)return false;if(f.to&&g.date>f.to)return false;if(f.number&&!norm(g.id).includes(norm(f.number))&&!norm(resolveJournalNo(g.id)).includes(norm(f.number)))return false;if(f.account&&!g.lines.some(l=>norm(l.name+' '+l.accountId).includes(norm(f.account))))return false;if(f.description&&!norm(g.description).includes(norm(f.description)))return false;if(f.amount){let n=Number(String(f.amount).replace(/,/g,''));if(!Number.isFinite(n)||!g.lines.some(l=>Math.abs(Number(l.debit||0)-n)<.005||Math.abs(Number(l.credit||0)-n)<.005)&&Math.abs(g.lines.reduce((s,l)=>s+Number(l.debit||0),0)-n)>.005)return false}if(journalQuery&&!norm([g.id,resolveJournalNo(g.id),g.date,isoDate(g.date),g.branch,g.description,...g.lines.map(l=>l.name+' '+l.accountId+' '+l.debit+' '+l.credit)].join(' ')).includes(norm(journalQuery)))return false;return true})}
function journalFilterField(label,key,type='text',placeholder=''){return `<div class="field"><label for="jf-${key}">${label}</label><input data-journal-filter="${key}" id="jf-${key}" type="${type}" placeholder="${h(placeholder)}" value="${h(journalFilters[key])}"></div>`}
function journalHTML(){let groups=filteredJournalGroups();return `<div class="section-head"><div><h2>اليومية العامة</h2><p>كل قيد ظاهر بشكل مستقل؛ المدين أولًا ثم الدائن، مع بحث تفصيلي في كل الحقول.</p></div><button class="btn secondary" data-export="journal">تنزيل اليومية Excel ↧</button></div><div id="journal-summary">${journalSummary(groups)}</div><div class="panel journal-filter-panel"><div class="panel-title"><span>⌕ &nbsp; البحث والفلترة في القيود</span><button type="button" class="btn secondary" id="journalclear">مسح الفلاتر ↺</button></div><div class="journal-filters"><div class="field search-all"><label for="journalfilter">بحث شامل</label><input id="journalfilter" placeholder="اكتب كلمة أو رقم أو اسم حساب..." value="${h(journalQuery)}"></div>${journalFilterField('من تاريخ','from','date')}${journalFilterField('إلى تاريخ','to','date')}${journalFilterField('رقم القيد','number','text','مثال: 1')}${journalFilterField('اسم / رقم الحساب','account','text','ابحث باسم الحساب')}${journalFilterField('القيمة بالجنيه','amount','number','المبلغ')}${journalFilterField('الوصف / البيان','description','text','جزء من وصف العملية')}</div></div><div id="journal-list">${journalCards(groups)}</div><div class="hint" style="margin:16px 4px">تظهر قيود العمليات المحفوظة داخل هذه الواجهة فقط؛ السجلات القديمة التي لا يوجد لها قيد مؤكد لن تُرحّل بشكل افتراضي.</div>`}
function journalSummary(groups){let all=groups.flatMap(g=>g.lines),dr=r2(all.reduce((s,x)=>s+Number(x.debit||0),0)),cr=r2(all.reduce((s,x)=>s+Number(x.credit||0),0));return `<div class="grid three" style="margin-bottom:18px">${kpi('المدين',m(dr)+' ج.م',groups.length+' قيد','#e9f7f4')}${kpi('الدائن',m(cr)+' ج.م','إجمالي القيود المعروضة','#eaf2ff')}${kpi('الفرق',m(dr-cr)+' ج.م',Math.abs(dr-cr)<.01?'قيود متوازنة':'راجع القيود',Math.abs(dr-cr)<.01?'#e5f7ef':'#ffe9eb')}</div>`}
function journalCards(groups){if(!groups.length)return `<div class="panel blank" style="margin-top:18px"><strong>لا توجد قيود مطابقة</strong><p>جرّب تغيير التاريخ أو الحساب أو المبلغ أو الوصف.</p></div>`;return `<div class="journal-count">${groups.length.toLocaleString('en-US')} قيد مطابق <span>· جميع البنود تظهر داخل قيدها الكامل</span></div><div class="journal-stack">${groups.slice(0,250).map(g=>{let sorted=[...g.lines].sort((a,b)=>(Number(b.debit)>0?1:0)-(Number(a.debit)>0?1:0));let dr=r2(g.lines.reduce((sum,x)=>sum+(Number(x.debit)||0),0)),cr=r2(g.lines.reduce((sum,x)=>sum+(Number(x.credit)||0),0));return `<article class="journal-card"><header class="journal-card-head"><div class="journal-ident"><div class="journal-icon">▤</div><div><div class="journal-subtitle">رقم القيد</div><h3 dir="ltr">${h(resolveJournalNo(g.id))}</h3></div></div><div class="journal-meta"><span>◷ ${isoDate(g.date)}</span><span>⌖ ${h(g.branch)}</span>${docsButton(g.id)}${Math.abs(dr-cr)<.01?pill('متوازن'):pill('غير متوازن','bad')}</div></header><div class="journal-description">${h(g.description||'بدون وصف')}</div><div class="table-wrap journal-lines"><table class="table"><thead><tr><th>رقم الحساب</th><th>اسم الحساب</th><th>مدين</th><th>دائن</th></tr></thead><tbody>${sorted.map(l=>`<tr class="${Number(l.debit)>0?'journal-debit':'journal-credit'}"><td><span class="code">${h(l.accountId)}</span></td><td class="main-cell">${Number(l.debit)>0?'<span class="entry-side debit-side">مدين</span>':'<span class="entry-side credit-side">دائن</span>'} ${h(l.name)}</td><td class="amount">${l.debit?m(l.debit):'—'}</td><td class="amount">${l.credit?m(l.credit):'—'}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2">إجمالي القيد</td><td class="amount">${m(dr)}</td><td class="amount">${m(cr)}</td></tr></tfoot></table></div></article>`}).join('')}</div>${groups.length>250?'<div class="hint">تم عرض أول 250 قيد؛ استخدم البحث للوصول إلى بقية القيود.</div>':''}`}

function statementLines(accId,from=reportFrom,to=reportTo,branch=reportBranch){let selected=account(accId),isSupplier=!!selected?.supplierKey;let rows=state.journal.filter(x=>String(x.accountId)===String(accId)&&(!branch||x.branch===branch)).sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.txnId).localeCompare(String(b.txnId)));let opening=isSupplier&&!branch?supplierOpeningDue(selected.supplierKey):0;let sign=isSupplier?-1:1;
for(const x of rows)if(!from||x.date<from)opening=r2(opening+sign*(num(x.debit)-num(x.credit)));
let running=opening;let moves=rows.filter(x=>(!from||x.date>=from)&&(!to||x.date<=to)).map(x=>{running=r2(running+sign*(num(x.debit)-num(x.credit)));return {date:x.date,description:x.details||'',number:resolveJournalNo(x.txnId),txnId:x.txnId||'',debit:num(x.debit),credit:num(x.credit),branch:x.branch||'',balance:running}});return {account:selected||{id:accId,name:'غير معروف'},from,to,branch,opening,closing:running,moves,totalDebit:r2(moves.reduce((s,x)=>s+x.debit,0)),totalCredit:r2(moves.reduce((s,x)=>s+x.credit,0)),liability:isSupplier,note:isSupplier&&!branch?'يشمل الرصيد الافتتاحي مستحقات المورد المستوردة من Excel دون إنشاء قيود تاريخية غير موثقة.':''}}
function accountStatement(id){return statementLines(id)}
function supplierStatement(name){return statementLines(supplierAccountId(name))}
function stockMovements(itemId){let item=state.settings.items.find(x=>String(x.id)===String(itemId));let rows=[];
for(const x of state.lots.filter(x=>String(x.itemId)===String(itemId))){rows.push({date:x.date,order:0,branch:x.branch||'',description:x.source==='opening'?'رصيد افتتاحي':`شراء من ${x.supplier||'مورد'} ${x.invoice?'— فاتورة '+x.invoice:''}`,number:resolveJournalNo(x.txnId),txnId:x.txnId||'',incoming:num(x.qty),outgoing:0,unitCost:num(x.unitCost),value:r2(num(x.qty)*num(x.unitCost))})}
for(const x of state.usages.filter(x=>String(x.itemId)===String(itemId))){let val=r2((x.allocations||[]).reduce((s,a)=>s+num(a.cost),0));rows.push({date:x.date,order:1,branch:x.branch||'',description:((state.revenues.find(r=>r.id===x.txnId)||{}).description||'استهلاك أثناء جلسة'),number:resolveJournalNo(x.txnId),txnId:x.txnId||'',incoming:0,outgoing:num(x.qty),unitCost:num(x.qty)?r2(val/num(x.qty)):0,value:-val})}
rows.sort((a,b)=>String(a.date).localeCompare(String(b.date))||a.order-b.order||String(a.number).localeCompare(String(b.number)));
let filtered=rows.filter(x=>!reportBranch||x.branch===reportBranch),opening=0,valueOpening=0;
for(const x of filtered)if(reportFrom&&x.date<reportFrom){opening=r2(opening+x.incoming-x.outgoing);valueOpening=r2(valueOpening+x.value)}
let balance=opening,value=valueOpening;let moves=filtered.filter(x=>(!reportFrom||x.date>=reportFrom)&&(!reportTo||x.date<=reportTo)).map(x=>{balance=r2(balance+x.incoming-x.outgoing);value=r2(value+x.value);return {...x,balance,stockValue:value}});
return {item:item||{id:itemId,name:'صنف'},opening,valueOpening,closing:balance,valueClosing:value,moves};}

function detailHTML(){let type=detailView.kind,id=detailView.id;let controls=`<div class="detail-controls"><button class="btn secondary" data-detail-back="1">↩ الرجوع للتقرير</button><div class="detail-exports"><button class="btn secondary" data-detail-export="xlsx">⇩ Excel</button><button class="btn" data-detail-export="pdf">⇩ PDF</button></div></div>`;
if(type==='supplier'||type==='account'){let s=detailStatement(type,id);return controls+statementHTML(s)}
if(type==='doctor'){let rows=state.revenues.filter(within).filter(x=>norm(x.doctor)===norm(id)),total=expenseSum(rows);return controls+`<div class="detail-heading"><div><div class="eyebrow">تقرير حالات الطبيب</div><h3>${h(id)}</h3></div><div class="pill blue">${rows.length} حالة</div></div><div class="grid three">${kpi('الإيرادات',m(total)+' ج.م','الفترة المحددة')}${kpi('عدد الحالات',rows.length,'حالة')}${kpi('متوسط الحالة',m(rows.length?total/rows.length:0)+' ج.م','متوسط قيمة الخدمة')}</div><h3>تفاصيل الحالات</h3>${table(['التاريخ','الفرع','الخدمة / الإجراء','العميل','الإيراد','التكلفة','صافي الربح','المستند'],rows.map(x=>[isoDate(x.date),h(x.branch),h(x.service),h(x.customer),m(x.amount),costText(x),profitText(x),docsButton(x.id)]))}`}
if(type==='item'){let s=stockMovements(id);return controls+`<div class="detail-heading"><div><div class="eyebrow">حركة صنف المخزن — الوارد أولًا يُصرف أولًا</div><h3>${h(s.item.name)}</h3></div><div class="pill blue">${h(s.item.unit||'وحدة')}</div></div><div class="grid three">${kpi('رصيد أول الفترة',m(s.opening),'وحدة')}${kpi('رصيد آخر الفترة',m(s.closing),'وحدة')}${kpi('قيمة الرصيد',m(s.valueClosing)+' ج.م','تكلفة الوارد أولًا يُصرف أولًا')}</div>${table(['التاريخ','رقم العملية','الفرع','نوع الحركة / البيان','وارد','منصرف','تكلفة الوحدة','قيمة الحركة','Balance','قيمة الرصيد','المستند'],s.moves.map(x=>[isoDate(x.date),h(x.number),h(x.branch),h(x.description),x.incoming?m(x.incoming):'—',x.outgoing?m(x.outgoing):'—',m(x.unitCost),m(x.value),`<b class="amount">${m(x.balance)}</b>`,m(x.stockValue),docsButton(x.txnId)]))}<p class="hint">الرصيد مبني على طبقات الشراء الفعلية والرصيد الافتتاحي المسعَّر وحركة الاستخدام.</p>`}
return '<div class="blank">تفاصيل غير متاحة</div>'}

function applySupplierAdvances(next,name,invoice){if(invoice.kind!=='supplier'||invoice.paid>=invoice.amount)return;let payments=next.transactions.filter(t=>t.kind==='supplier-payment'&&norm(t.supplier)===norm(name)&&num(t.unallocated)>.001).sort((a,b)=>String(a.date).localeCompare(String(b.date)));for(let tx of payments){let take=r2(Math.min(num(tx.unallocated),Math.max(0,invoice.amount-invoice.paid)));if(take<=0)continue;invoice.paid=r2(invoice.paid+take);tx.unallocated=r2(tx.unallocated-take);tx.allocations=Array.isArray(tx.allocations)?tx.allocations:[];tx.allocations.push({invoiceId:invoice.id,invoice:invoice.invoice,amount:take});if(invoice.paid>=invoice.amount-.001)break}}

function excelCol(n){let s='';for(n++;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s}
async function excelFile(title,headers,rows,filename,meta=[]){
  if(typeof JSZip==='undefined')throw Error('مكتبة إنشاء ملفات Excel غير متاحة');
  // A real XLSX workbook: the report title, metadata, column header and each data
  // row have separate styles. All body cells are styled, including blank cells.
  const zip=new JSZip(),cleanHeaders=headers.map(v=>String(v??''));
  const columns=Math.max(cleanHeaders.length,2),now=new Date();
  const prettyDate=now.toLocaleDateString('ar-EG',{year:'numeric',month:'2-digit',day:'2-digit'});
  const metaRows=meta.map(pair=>[pair[0],pair[1]]);
  const all=[['NILI CLINIC  |  '+title],['تاريخ التصدير',prettyDate],...metaRows,[],cleanHeaders,...rows];
  const headerRow=metaRows.length+4,firstDataRow=headerRow+1,finalRow=Math.max(headerRow,all.length);
  const widths=cleanHeaders.map((head,i)=>{
    let count=String(head).length;
    for(let j=0;j<Math.min(70,rows.length);j++)count=Math.max(count,String(rows[j]?.[i]??'').length);
    if(/الوصف|البيان|التفاصيل/.test(head))return 43;
    if(/المستند/.test(head))return 29;
    if(/التاريخ|استحقاق/.test(head))return 19;
    if(/العميل|الدكتور|المورد|الصنف|الخدمة|النوع/.test(head))return Math.max(23,Math.min(37,count*.9+6));
    if(/المبلغ|الإيراد|التكلفة|الربح|الرصيد|القيمة|مدين|دائن|Balance/.test(head))return 20;
    return Math.max(17,Math.min(32,count*.87+7));
  });
  while(widths.length<columns)widths.push(22);
  function cell(val,ri,ci){
    const addr=excelCol(ci)+(ri+1),isTitle=ri===0,isMeta=ri>=1&&ri<3+metaRows.length,
      isHead=ri===headerRow-1,isBody=ri>=headerRow;
    const numeric=typeof val==='number'&&Number.isFinite(val);
    const odd=(ri-headerRow)%2===0;
    const style=isTitle?1:isHead?2:isMeta?(ci===0?3:4):isBody?(numeric?(odd?7:6):(odd?5:0)):0;
    const safe=val==null?'':String(val).slice(0,32000);
    if(numeric)return `<c r="${addr}" s="${style}"><v>${val}</v></c>`;
    return `<c r="${addr}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${xml(safe)}</t></is></c>`;
  }
  const body=all.map((values,ri)=>{
    const rowNum=ri+1,isHeader=rowNum===headerRow,isTitle=ri===0,isBody=rowNum>headerRow;
    const h=isTitle?39:isHeader?35:isBody?26:ri<2+metaRows.length?25:11;
    const cells=Array.from({length:isTitle?1:isBody||isHeader?columns:Math.max(2,values.length)},(_,ci)=>cell(values[ci],ri,ci)).join('');
    return `<row r="${rowNum}" ht="${h}" customHeight="1">${cells}</row>`;
  }).join('');

  const lastCol=excelCol(columns-1),lastHeader=excelCol(cleanHeaders.length-1);

function saveBlob(name,blob){let url=URL.createObjectURL(blob),a=el('a',{href:url,download:name});document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}

// Print-quality PDFs are generated by the browser's native print engine.
// Unlike canvas/JPEG exports, Arabic text, numbers, table headings and amounts
// stay real selectable/searchable text. Save as PDF in the browser dialog.
function pdfTable(title,headers,rows,filename,meta=[]){
  const pop=window.open('about:blank','_blank');
  if(!pop){toast('اسمح بفتح النافذة المنبثقة لتصدير PDF',true);return}
  const maxCols=headers.length,wide=maxCols>=8,landscape=maxCols>=6;
  const sheetSize=wide?'A3 landscape':landscape?'A4 landscape':'A4 portrait';
  const titleSafe=h(String(title)),fileSafe=h(String(filename));
  const numericHead=v=>/^(مدين|دائن|Balance|الوارد|المنصرف|وارد|منصرف|المبلغ|الكمية|التكلفة|الإيراد|صافي الربح|القيمة|الرصيد|قيمة الرصيد|قيمة الحركة|الإجمالي|سعر الوحدة|متبقي|المدفوع)/.test(String(v));
  const formatValue=(v,k)=>typeof v==='number'&&Number.isFinite(v)?v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):String(v??'').trim();
  const colStyles=headers.map((header,i)=>{
    if(/الوصف|البيان|التفاصيل|الخدمة/.test(header))return 2.4;
    if(/المستند/.test(header))return 1.3;
    if(/الدكتور|المورد|العميل|الصنف|الحساب/.test(header))return 1.55;
    if(/التاريخ/.test(header))return 1.4;
    return 1;
  });
  const colTotal=colStyles.reduce((s,v)=>s+v,0);
  const colgroup=headers.map((_,i)=>`<col style="width:${(colStyles[i]*100/colTotal).toFixed(3)}%">`).join('');
  const dataRows=rows.map((row,ri)=>`<tr>${headers.map((head,ci)=>`<td class="${numericHead(head)?'number-cell':''}">${h(formatValue(row[ci],head))||'—'}</td>`).join('')}</tr>`).join('');
  const metaHtml=meta.map(([label,value])=>`<div class="fact"><span>${h(String(label))}</span><strong>${h(formatValue(value,label))}</strong></div>`).join('');
  const html=`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${titleSafe} | NILI CLINIC</title><style>
  @page{size:${sheetSize};margin:17mm 13mm 16mm}
  *{box-sizing:border-box}html,body{margin:0;color:#182f48;background:white;font-family:Tahoma,Arial,'Noto Naskh Arabic',sans-serif;direction:rtl;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-size:${wide?'10px':landscape?'11px':'12px'};line-height:1.55}
  .top{border-top:6px solid #176a85;padding:15px 0 13px;border-bottom:1px solid #d6e4ee;margin-bottom:15px;display:flex;justify-content:space-between;align-items:start;gap:12px;break-after:avoid}
  .brand{font:bold 22px Arial,sans-serif;color:#173955;letter-spacing:1px;direction:ltr;text-align:left}
  .subtitle{font-size:10px;color:#72879b;letter-spacing:.1px;text-align:left}
  h1{font-size:${wide?'19px':'21px'};margin:0 0 4px;color:#174f6d;line-height:1.55}
  .report-id{font-size:10px;color:#6b8298;text-align:right}
  .meta{display:grid;grid-template-columns:repeat(${wide?4:landscape?3:2},minmax(0,1fr));gap:8px;margin:0 0 16px;break-inside:avoid}
  .fact{border:1px solid #e0eaf1;border-radius:7px;background:#f5f9fc;padding:6px 10px;min-width:0}
  .fact span{display:block;color:#647b8d;font-size:10px}.fact strong{display:block;font-size:12px;overflow-wrap:anywhere}
  table{border-collapse:collapse;table-layout:fixed;width:100%;direction:rtl}
  thead{display:table-header-group}tbody{display:table-row-group}
  th{background:#17627c!important;color:#fff!important;text-align:right;font-weight:700;padding:9px 6px;border:1px solid #17627c;font-size:${wide?'9px':'10px'};line-height:1.4}
  td{padding:8px 6px;vertical-align:top;overflow-wrap:anywhere;word-break:normal;border:1px solid #dfe9f0;unicode-bidi:plaintext}
  tbody tr:nth-child(odd){background:#f3f8fb!important}tbody tr:nth-child(even){background:#fff!important}
  tr{break-inside:avoid;page-break-inside:avoid}
  .number-cell{direction:ltr;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-family:Tahoma,Arial,sans-serif}
  .foot{margin-top:16px;padding:11px 3px;border-top:2px solid #d9e6ee;color:#42637c;display:flex;justify-content:space-between;font-weight:bold;break-inside:avoid}
  .no-records{padding:26px 10px;text-align:center;color:#718699}
  @media screen{body{max-width:${wide?'1450px':landscape?'1100px':'850px'};margin:28px auto;padding:15px 25px;box-shadow:0 8px 32px #152c491a}.screen-controls{position:sticky;top:5px;z-index:5;display:flex;gap:10px;justify-content:flex-start;margin-bottom:12px}.print-btn{background:#176a85;color:white;padding:9px 20px;border:0;border-radius:8px;cursor:pointer;font:700 14px Tahoma,Arial}.hint{color:#617c94;font-size:11px}}
  @media print{.screen-controls{display:none}.top{margin-top:0}.foot{break-before:avoid}}
  </style></head><body><div class="screen-controls"><button class="print-btn" onclick="window.print()">حفظ PDF / طباعة</button><span class="hint">اختر «Save as PDF» في نافذة الطباعة</span></div><div class="top"><div><h1>${titleSafe}</h1><div class="report-id">التقارير المالية والإدارية</div></div><div><div class="brand">NILI CLINIC</div><div class="subtitle">FINANCIAL MANAGEMENT</div></div></div>
  ${metaHtml?`<div class="meta">${metaHtml}</div>`:''}
  <table><colgroup>${colgroup}</colgroup><thead><tr>${headers.map(head=>`<th>${h(String(head))}</th>`).join('')}</tr></thead><tbody>${dataRows||`<tr><td colspan="${headers.length}" class="no-records">لا توجد بيانات في الفترة المحددة</td></tr>`}</tbody></table>
  <div class="foot"><span>عدد السجلات: ${rows.length.toLocaleString('en-US')}</span><span>NILI CLINIC</span></div>
  <script>window.addEventListener('load',()=>{setTimeout(()=>{try{window.print()}catch(e){}},350)})<\/script></body></html>`;
  pop.document.open();pop.document.write(html);pop.document.close();
  toast('تم فتح التقرير بجودة الطباعة — اختر Save as PDF');
}

function addSetting(){try{let key=q('setcollection').value,name=q('setname').value.trim(),cat=q('setcategory').value.trim(),unit=q('setunit').value.trim();assert(name,'اكتب اسم العنصر');let next=structuredClone(state),arr=next.settings[key];assert(Array.isArray(arr),'القائمة غير صحيحة');let values=arr.map(x=>norm(typeof x==='string'?x:x.name));assert(!values.includes(norm(name)),'الاسم موجود بالفعل في القائمة');if(key==='items')arr.push({id:'IT-CUSTOM-'+(state.sequence+1),name,category:cat||'غير مصنف',unit:unit||'وحدة'});else if(key==='procedures')arr.push({name,category:cat||'غير مصنف'});else arr.push(name);if(key==='suppliers'){let max=Math.max(22,...next.settings.accounts.map(a=>Number(a.id)||0));next.settings.accounts.push({id:String(max+1),name:supplierLabel(name),type:'موردون وأوراق دفع',supplierKey:name,added:true})}if(key==='expenseTypes'&&!expenseAccount(name))toast('تمت إضافة نوع المصروف. تأكد من إنشاء حساب بنفس الاسم في شجرة الحسابات.');next.sequence++;if(save(next)){toast('تمت إضافة '+name+(key==='suppliers'?' وإنشاء حساب المورد تلقائيًا':''));render()}}catch(e){toast(e.message,true)}}

function addAccount(){try{let name=q('newaccname').value.trim(),type=q('newacctype').value,cashType=type==='نقدية وما في حكمها'?(q('newacccashtype')?.value||'كاش'):'';assert(name,'اكتب اسم الحساب');let next=structuredClone(state),ids=next.settings.accounts.map(a=>Number(a.id)).filter(Number.isFinite),id=String(Math.max(22,...ids)+1);assert(!accountByName(name),'الحساب موجود بالفعل');if(type==='موردون وأوراق دفع'){let supplier=name.replace(/^مورد\s*[-–:]\s*/,'').trim();assert(!next.settings.suppliers.some(x=>norm(x)===norm(supplier)),'اسم المورد موجود بالفعل');next.settings.suppliers.push(supplier);next.settings.accounts.push({id,name:supplierLabel(supplier),supplierKey:supplier,type,added:true,cashType:''})}else{next.settings.accounts.push({id,name,type,cashType,added:true})}if(save(next)){toast(type==='موردون وأوراق دفع'?'تمت إضافة المورد وحسابه الخاص':'تمت إضافة الحساب');render()}}catch(e){toast(e.message,true)}}

async function importBackup(){try{let f=q('importfile')?.files[0];assert(!!f,'اختر ملف النسخة الاحتياطية');assert(f.size<7000000,'النسخة كبيرة جدًا');let text=await f.text(),data=JSON.parse(text);assert([4,5,6].includes(data.version)&&Array.isArray(data.journal)&&Array.isArray(data.revenues)&&Array.isArray(data.lots)&&Array.isArray(data.settings?.customers),'ملف النسخة غير صالح لهذا الإصدار');if(!confirm('سيتم استبدال بيانات الجلسة الحالية بالكامل، هل تريد الاستمرار؟'))return;let migrated=upgradeState(data);if(save(migrated)){toast('تم استيراد النسخة بنجاح');navTo('dashboard')}}catch(e){toast('فشل الاستيراد: '+e.message,true)}}
function viewFiles(id){let record=[...records(),...state.invoices].find(x=>String(x.id)===String(id));if(!record||!record.documents?.length)return;let docs=record.documents.filter(d=>d&&d.data);if(!docs.length){toast('المستند غير محفوظ داخل النظام',true);return}let shade=document.createElement('div');shade.className='document-modal-shade';shade.style.cssText='position:fixed;inset:0;background:#10233acc;z-index:999;display:grid;place-items:center;padding:20px';shade.innerHTML=`<div class="panel" style="width:min(650px,100%);max-height:80vh;overflow:auto"><div class="split"><div><b>مستندات العملية</b><div class="hint">${h(String(record.id))} — ${docs.length} مرفق</div></div><button class="btn secondary" data-closefiles>✕ إغلاق</button></div><hr class="sep">${docs.map((d,i)=>`<div class="preview-row"><span>▧ ${h(d.name||'مستند')}</span><div style="display:flex;gap:8px"><button class="btn secondary" data-open-doc="${i}">↗ فتح</button><button class="btn secondary" data-down="${i}">⇩ تنزيل</button></div></div>`).join('')}<p class="hint" style="margin-top:12px">ملفات PDF والصور تُفتح في تبويب جديد؛ بقية الملفات يمكن تنزيلها وفتحها ببرنامجها.</p></div>`;shade.addEventListener('click',e=>{if(e.target===shade||e.target.closest('[data-closefiles]')){shade.remove();return}let open=e.target.closest('[data-open-doc]'),down=e.target.closest('[data-down]');if(!open&&!down)return;let d=docs[Number((open||down).dataset.openDoc??(open||down).dataset.down)];try{let b64=String(d.data||'').split(',')[1],bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)),blob=new Blob([bytes],{type:d.type||'application/octet-stream'}),url=URL.createObjectURL(blob);if(open&&(/pdf|image/.test(d.type||'')||/\.(pdf|jpg|jpeg|png|webp)$/i.test(d.name||''))){let win=window.open('about:blank','_blank');if(win){win.opener=null;win.location.href=url}else toast('المتصفح منع فتح نافذة المستند؛ استخدم تنزيل',true)}else{let a=document.createElement('a');a.href=url;a.download=d.name||'مستند';document.body.appendChild(a);a.click();a.remove()}setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(err){toast('تعذر فتح المرفق: '+err.message,true)}});document.body.appendChild(shade)}

function beginPay(id){let invoice=state.invoices.find(x=>x.id===id);if(!invoice)return;formType='supplier';cart=[];draft.purchaseType='settle';draft.supplier=invoice.supplier;draft.payInvoice=invoice.id;draft.branch=invoice.branch;draft.amount=String(invoiceBalance(invoice));draft.description='سداد فاتورة '+invoice.invoice;draft.method='';navTo('entry')}
const pickerOptions={service:()=>[...state.settings.procedures.map(x=>({value:x.name,sub:x.category||''})),...state.settings.serviceCategories.filter(x=>!state.settings.procedures.some(y=>norm(y.name)===norm(x))).map(x=>({value:x,sub:'تصنيف خدمة'}))],doctor:()=>state.settings.doctors.map(x=>({value:x,sub:''})),supplier:()=>state.settings.suppliers.map(x=>({value:x,sub:''})),customer:()=>state.settings.customers.map(x=>({value:x.name,sub:x.phone,searchExtra:localPhone(x.phone),id:x.id})),expenseType:()=>state.settings.expenseTypes.map(x=>({value:x,sub:''})),product:()=>state.settings.items.map(x=>({value:x.name,sub:x.category+' · '+x.unit,id:x.id}))};
let displayedPicker={};
function pickerOpen(name){let input=q(name),panel=q('list-'+name);if(!input||!panel||!pickerOptions[name])return;let search=norm(input.value),opts=pickerOptions[name]().filter(x=>norm(x.value+' '+x.sub+' '+(x.searchExtra||'')).includes(search)).slice(0,24);displayedPicker[name]=opts;panel.innerHTML=opts.length?opts.map((x,i)=>`<button type="button" class="picker-opt" data-pick="${name}" data-index="${i}">${h(x.value)}${x.sub?`<small>${h(x.sub)}</small>`:''}</button>`).join(''):'<div class="empty-opt">لا توجد نتائج — أضف الاسم من الإعدادات</div>';panel.classList.add('open')}
function pickerSelect(name,index){let chosen=displayedPicker[name]?.[index];if(!chosen)return;draft[name]=chosen.value;let input=q(name);if(input)input.value=chosen.value;if(name==='customer')draft.clientId=chosen.id;if(name==='product')draft.product=chosen.value;let panel=q('list-'+name);if(panel)panel.classList.remove('open');if(name==='supplier'&&draft.purchaseType==='settle'){draft.payInvoice='';render()}else if(name==='service'){draft.category=state.settings.procedures.find(x=>x.name===chosen.value)?.category||chosen.value;showSummary()}else showSummary()}
function showSummary(){let n=q('live-summary');if(n)n.innerHTML=summaryHTML()}
function openQuickModal(kind){if(!['service','doctor','customer','supplier'].includes(kind))return;quickModal=kind;let labels={service:'إضافة خدمة / إجراء جديد',doctor:'إضافة دكتور جديد',customer:'إضافة عميل جديد',supplier:'إضافة مورد جديد'};let descriptions={service:'هتظهر الخدمة فورًا في قائمة البحث الخاصة بالإيرادات.',doctor:'هيظهر الدكتور فورًا في قائمة الدكاترة.',customer:'هيظهر العميل في البحث بالاسم أو رقم الهاتف.',supplier:'سيتم إنشاء حساب مستقل للمورد في شجرة الحسابات ويظهر فورًا في المعاملة.'};let shade=document.createElement('div');shade.className='quick-modal-shade';shade.id='quickshade';shade.innerHTML=`<section class="quick-modal" role="dialog" aria-modal="true" aria-labelledby="quicktitle"><header class="quick-modal-head"><div class="quick-modal-icon">＋</div><div><div class="eyebrow">الإعدادات السريعة</div><h2 id="quicktitle">${labels[kind]}</h2></div><button type="button" id="modalclose" class="modal-x" aria-label="إغلاق">✕</button></header><p class="hint">${descriptions[kind]}</p><div class="field"><label for="quickname">${kind==='customer'?'اسم العميل':kind==='doctor'?'اسم الدكتور':kind==='supplier'?'اسم المورد':'اسم الخدمة / الإجراء'} <span class="req">*</span></label><input id="quickname" autocomplete="off" placeholder="اكتب الاسم هنا"></div>${kind==='customer'?'<div class="field"><label for="quickphone">رقم الموبايل <span class="req">*</span></label><input id="quickphone" type="tel" dir="ltr" placeholder="01xxxxxxxxx"></div>':kind==='service'?`<div class="field"><label for="quickcategory">تصنيف الخدمة (اختياري)</label><input id="quickcategory" placeholder="مثل ليزر أو فيلر" list="serviceCategoryHints"><datalist id="serviceCategoryHints">${state.settings.serviceCategories.map(x=>`<option value="${h(x)}"></option>`).join('')}</datalist></div>`:''}<div class="quick-modal-actions"><button class="btn secondary" id="modalcancel" type="button">إلغاء</button><button class="btn" type="button" id="modaladd">✓ حفظ واختيار</button></div></section>`;q('app').appendChild(shade);q('quickname')?.focus()}
function closeQuickModal(){q('quickshade')?.remove();quickModal=''}
function saveQuickModal(){try{let kind=quickModal,name=q('quickname')?.value.trim()||'';assert(name.length>=2,'اكتب اسمًا صحيحًا (حرفان على الأقل)');let next=structuredClone(state);if(kind==='customer'){let phone=q('quickphone')?.value.trim()||'';assert(localPhone(phone).replace(/\D/g,'').length>=10,'اكتب رقم موبايل صحيحًا');assert(!next.settings.customers.some(x=>norm(x.phone)===norm(phone)||norm(localPhone(x.phone))===norm(localPhone(phone))),'رقم الهاتف مسجل لعميل آخر');let c={id:'C-'+(next.sequence+1),name,phone};next.settings.customers.push(c);draft.customer=name;draft.clientId=c.id}else if(kind==='doctor'){assert(!next.settings.doctors.some(x=>norm(x)===norm(name)),'الدكتور موجود في القائمة بالفعل');next.settings.doctors.push(name);draft.doctor=name}else if(kind==='service'){assert(!next.settings.procedures.some(x=>norm(x.name)===norm(name))&&!next.settings.serviceCategories.some(x=>norm(x)===norm(name)),'الخدمة موجودة بالفعل');let category=q('quickcategory')?.value.trim()||'غير مصنف';next.settings.procedures.push({name,category});draft.service=name;draft.category=category}else if(kind==='supplier'){assert(!next.settings.suppliers.some(x=>norm(x)===norm(name)),'المورد مسجل بالفعل');next.settings.suppliers.push(name);let ids=next.settings.accounts.map(a=>Number(a.id)).filter(Number.isFinite);next.settings.accounts.push({id:String(Math.max(22,...ids)+1),name:supplierLabel(name),type:'موردون وأوراق دفع',supplierKey:name,added:true});if(formType==='supplier'){draft.supplier=name;draft.payInvoice=''}else if(formType==='transfer'){draft.inc=supplierAccountId(name,next)}}else throw Error('النوع غير معروف');next.sequence++;assert(save(next),'تعذّر حفظ الإضافة');closeQuickModal();render();toast('تمت الإضافة واختيار '+name+' بنجاح');}catch(e){toast(e.message,true)}}
function addListeners(){let root=q('app');root.addEventListener('click',e=>{let pick=e.target.closest('[data-pick]');if(pick){pickerSelect(pick.dataset.pick,Number(pick.dataset.index));return}let quick=e.target.closest('[data-quickadd]');if(quick){openQuickModal(quick.dataset.quickadd);return}if(e.target.closest('#modalcancel')||e.target.closest('#modalclose')||e.target.id==='quickshade'){closeQuickModal();return}if(e.target.closest('#modaladd')){saveQuickModal();return}if(e.target.closest('#navtoggle')){toggleSidebar();return}if(e.target.closest('#navscrim')){mobileSidebarOpen=false;syncSidebar();return}if(e.target.closest('#journalclear')){journalQuery='';journalFilters={from:'',to:'',number:'',account:'',amount:'',description:''};render();return}if(e.target.closest('[data-statement-pdf]')){exportStatement(accountStatement(statementAccount),'pdf');return}let go=e.target.closest('[data-detail]');if(go){detailView={kind:go.dataset.detail,id:decodeURIComponent(go.dataset.id)};if(go.dataset.detail==='doctor')reportKind='doctors';else if(go.dataset.detail==='supplier')reportKind='suppliers';else if(go.dataset.detail==='item')reportKind='inventory';else if(go.dataset.detail==='account')reportKind='statement';view='reports';render();window.scrollTo({top:0,behavior:'instant'});return}
if(e.target.closest('[data-detail-back]')){detailView=null;render();return}
let dex=e.target.closest('[data-detail-export]');if(dex){exportDetail(dex.dataset.detailExport);return}
let n=e.target.closest('[data-nav]');if(n){mobileSidebarOpen=false;detailView=null;navTo(n.dataset.nav);return}let f=e.target.closest('[data-form]');if(f){formType=f.dataset.form;cart=[];draft.product='';draft.qty='';draft.unitPrice='';render();return}let rem=e.target.closest('[data-remove]');if(rem){cart.splice(Number(rem.dataset.remove),1);if(formType==='supplier'&&draft.purchaseType!=='settle')draft.amount=String(r2(cart.reduce((s,x)=>s+x.qty*x.price,0)));render();return}let b=e.target.closest('[data-purchase]');if(b){draft.purchaseType=b.dataset.purchase;cart=[];draft.amount='';render();return}let rp=e.target.closest('[data-report]');if(rp){reportKind=rp.dataset.report;detailView=null;render();return}let st=e.target.closest('[data-setting]');if(st){settingsKind=st.dataset.setting;filterText='';render();return}let doc=e.target.closest('[data-files]');if(doc){viewFiles(doc.dataset.files);return}let p=e.target.closest('[data-pay]');if(p){beginPay(p.dataset.pay);return}let exp=e.target.closest('[data-export]');if(exp){exportData(exp.dataset.export);return}
if(e.target.closest('#addmaterial'))newMaterial();if(e.target.closest('#saveentry'))postEntry();if(e.target.closest('#addsetting'))addSetting();if(e.target.closest('#addclient'))addCustomer();if(e.target.closest('#addaccount'))addAccount();if(e.target.closest('#open-stock')){let box=q('stock-opening');if(box)box.style.display=box.style.display==='none'?'block':'none'}if(e.target.closest('#save-stock'))openingStock();if(e.target.closest('#importdata'))importBackup();if(e.target.closest('#resetdata')){if(confirm('سيتم حذف إدخالات هذه الجلسة والرجوع للبيانات الأصلية المستوردة من Excel. هل أنت متأكد؟')){if(save(initial())){toast('تمت إعادة البيانات الأساسية');navTo('dashboard')}}}if(e.target.closest('#openmenu'))toggleSidebar();if(e.target.closest('#closemenu')){mobileSidebarOpen=false;syncSidebar()}});
root.addEventListener('input',e=>{let x=e.target;if(x.dataset.draft){draft[x.dataset.draft]=x.value;if(x.dataset.draft==='customer')draft.clientId='';if(x.dataset.draft==='supplier')draft.payInvoice='';if(x.dataset.picker)pickerOpen(x.dataset.picker);showSummary()}if(x.id==='record-filter'){filterText=x.value;q('record-table').innerHTML=transactionsTable(records().filter(rec=>norm([rec.description,rec.customer,rec.service,rec.doctor,rec.supplier,rec.expenseType,rec.method,rec.id].join(' ')).includes(norm(filterText))))}if(x.id==='stockfilter'){inventoryQuery=x.value;q('inventory-table').innerHTML=inventoryTable(state.settings.items.filter(rec=>norm(rec.name).includes(norm(inventoryQuery))))}if(x.id==='journalfilter'){journalQuery=x.value;refreshJournal()}if(x.dataset.journalFilter){journalFilters[x.dataset.journalFilter]=x.value;refreshJournal()}if(x.id==='clientfilter'){filterText=x.value;q('clienttable').innerHTML=clientsTable(filterText)}});
root.addEventListener('focusin',e=>{let x=e.target;if(x.dataset.picker)pickerOpen(x.dataset.picker)});
root.addEventListener('focusout',e=>{let x=e.target;if(x.dataset.picker)setTimeout(()=>{let p=q('list-'+x.dataset.picker);if(p)p.classList.remove('open')},170)});
root.addEventListener('change',e=>{let x=e.target;if(x.dataset.draft){draft[x.dataset.draft]=x.value;if(x.dataset.draft==='method'){draft.bankChannel='';render();return}showSummary()}if(x.dataset.accountCashType){let next=structuredClone(state),a=next.settings.accounts.find(a=>String(a.id)===String(x.dataset.accountCashType));if(a&&a.type==='نقدية وما في حكمها'&&['بنك','كاش'].includes(x.value)){a.cashType=x.value;if(save(next)){toast('تم تحديث نوع الحساب');render()}}return}if(x.id==='newacctype'){let field=q('newacccashbox');if(field)field.style.display=x.value==='نقدية وما في حكمها'?'flex':'none'}if(x.id==='attachment'){pendingFiles.push(...Array.from(x.files||[]));if(q('filelabels'))q('filelabels').innerHTML=pendingFiles.map(f=>pill(f.name,'blue')).join(' ')}if(x.id==='reportfrom'){reportFrom=x.value;render()}if(x.id==='reportto'){reportTo=x.value;render()}if(x.id==='reportbranch'){reportBranch=x.value;render()}if(x.id==='statement-account'){statementAccount=x.value;render()}})
}
function wire(){if(view==='entry'&&pendingFiles.length&&q('filelabels'))q('filelabels').innerHTML=pendingFiles.map(f=>pill(f.name,'blue')).join(' ')}
addListeners();render();
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(quickModal){closeQuickModal();return}if(mobileSidebarOpen){mobileSidebarOpen=false;syncSidebar()}}if(e.key==='Enter'&&quickModal&&e.target?.closest('#quickshade')&&e.target?.tagName==='INPUT'){e.preventDefault();saveQuickModal()}});
window.addEventListener('resize',()=>{if(window.innerWidth>1100&&mobileSidebarOpen){mobileSidebarOpen=false;syncSidebar()}});
</script>
</body></html>
